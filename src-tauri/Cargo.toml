[package]
name = "mistr"
version = "0.0.1"
description = "Native-data NEXRAD rendering feasibility prototype"
authors = ["Mistr contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "mistr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
