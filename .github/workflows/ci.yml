name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-prototype:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Record Rust toolchain
        run: rustup show

      - name: Verify public-repository boundaries
        run: npm run public:check

      - name: Check documentation links
        run: npm run docs:check

      - name: Download and verify the public Level II fixture
        run: npm run fixture:download

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: npm run rust:fmt

      - name: Run Rust lints
        run: npm run rust:clippy

      - name: Run Rust tests
        run: npm run rust:test

      - name: Compile the Tauri application
        run: npm run tauri:build -- --no-bundle

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
